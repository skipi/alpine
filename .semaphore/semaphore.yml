version: v1.0
name: Alpine.js

agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404

auto_cancel:
  running:
    when: "branch != 'main' AND branch != 'master'"

global_job_config:
  env_vars:
    - name: CYPRESS_CACHE_FOLDER
      value: /home/semaphore/.cache/Cypress
  prologue:
    commands:
      - checkout
      - sem-version node 18
      - cache restore node-modules-$(checksum package-lock.json),node-modules-
      - cache restore cypress-bin-$(checksum package-lock.json),cypress-bin-

blocks:
  - name: Install and build
    dependencies: []
    task:
      jobs:
        - name: install + build
          commands:
            - npm ci
            - npm run build
            - cache store node-modules-$(checksum package-lock.json) node_modules
            - cache store cypress-bin-$(checksum package-lock.json) /home/semaphore/.cache/Cypress

  - name: Cypress
    dependencies: ["Install and build"]
    task:
      jobs:
        - name: cypress
          parallelism: 4
          commands:
            - npm run build
            - 'specs=$(find tests/cypress/integration -name "*.spec.js" | sort | awk "NR % $SEMAPHORE_JOB_COUNT == ($SEMAPHORE_JOB_INDEX - 1)" | paste -sd, -)'
            - 'echo "Shard $SEMAPHORE_JOB_INDEX/$SEMAPHORE_JOB_COUNT:"; echo "$specs" | tr , "\n"'
            - npx cypress run --quiet --spec "$specs"

  - name: Vitest
    dependencies: ["Install and build"]
    task:
      jobs:
        - name: vitest
          commands:
            - npm run build
            - npm run vitest

promotions:
  - name: Release
    pipeline_file: release.yml
