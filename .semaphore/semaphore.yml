version: v1.0
name: Alpine.js CI

agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404

auto_cancel:
  running:
    when: "branch != 'main' AND branch != 'master'"

global_job_config:
  env_vars:
    - name: CYPRESS_CACHE_FOLDER
      value: /home/semaphore/alpine/node_modules/.cypress-cache
  prologue:
    commands:
      - checkout
      - sem-version node 18
      - cache restore node-modules-$(checksum package-lock.json),node-modules-

blocks:
  - name: Setup
    dependencies: []
    task:
      jobs:
        - name: Install and build
          commands:
            - npm ci
            - npx cypress install
            - npm run build
            - cache delete node-modules-$(checksum package-lock.json)
            - cache store node-modules-$(checksum package-lock.json) node_modules
            - cache store dist-$SEMAPHORE_GIT_SHA packages

  - name: Cypress
    dependencies:
      - Setup
    task:
      prologue:
        commands:
          - cache restore dist-$SEMAPHORE_GIT_SHA
          - mkdir -p junit
      epilogue:
        always:
          commands:
            - test-results publish junit/ || true
      jobs:
        - name: Browser tests
          parallelism: 3
          commands:
            - SPECS=$(find tests/cypress/integration -name "*.spec.js" | sort | awk "NR % $SEMAPHORE_JOB_COUNT == $SEMAPHORE_JOB_INDEX - 1" | paste -sd,)
            - echo "Running specs - $SPECS"
            - npx cypress run --quiet --spec "$SPECS"

  - name: Vitest
    dependencies:
      - Setup
    task:
      prologue:
        commands:
          - cache restore dist-$SEMAPHORE_GIT_SHA
      epilogue:
        always:
          commands:
            - test-results publish junit/ || true
      jobs:
        - name: Unit tests
          commands:
            - mkdir -p junit
            - npx vitest run --reporter=default --reporter=junit --outputFile.junit=junit/vitest.xml

after_pipeline:
  task:
    jobs:
      - name: Aggregate test results
        commands:
          - test-results gen-pipeline-report || true
