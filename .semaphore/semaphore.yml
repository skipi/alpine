version: v1.0
name: Run Tests
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404

global_job_config:
  prologue:
    commands:
      - checkout
      - sem-version node 18
      - cache restore cypress-bin-7,cypress-bin
      - cache restore node-modules-$(checksum package-lock.json),node-modules-main
      - npm install
      - cache store node-modules-$(checksum package-lock.json) node_modules
      - cache store cypress-bin-7 ~/.cache/Cypress

blocks:
  - name: Build
    dependencies: []
    task:
      jobs:
        - name: Build
          commands:
            - npm run build
            - artifact push workflow packages --force

  - name: Test
    dependencies: [Build]
    task:
      prologue:
        commands:
          - artifact pull workflow packages
      jobs:
        - name: Cypress
          parallelism: 4
          commands:
            - export SPECS=$(find tests/cypress/integration -name "*.spec.js" | awk "NR % $SEMAPHORE_JOB_COUNT == ($SEMAPHORE_JOB_INDEX - 1)" | paste -sd, -)
            - npx cypress run --quiet --spec "$SPECS"

        - name: Vitest
          commands:
            - npm run vitest

# TODO(gha-to-semaphore): the original Release workflow used `workflow_dispatch`
# (manual trigger with an input). On Semaphore that's modeled as a manual
# promotion with a parameter. The promotion below points to release.yml; trigger
# it from the workflow UI or with `sem-ai pipeline_promote`.
promotions:
  - name: Release
    pipeline_file: release.yml
    parameters:
      env_vars:
        - name: RELEASE_VERSION
          required: true
          description: 'Version to release (e.g. 3.15.12 or v3.15.12)'
