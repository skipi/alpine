version: v1.0
name: Alpine.js

agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404

auto_cancel:
  running:
    when: "branch != 'main' AND branch != 'master'"

global_job_config:
  env_vars:
    - name: CYPRESS_CACHE_FOLDER
      value: node_modules/.cypress-cache
  prologue:
    commands:
      - checkout
      - sem-version node 18
      - cache restore node-modules-$(checksum package-lock.json),node-modules-
      - npm install
      - cache store node-modules-$(checksum package-lock.json) node_modules
      - npm run build

blocks:
  - name: Tests
    dependencies: []
    task:
      epilogue:
        always:
          commands:
            - test-results publish reports/
      jobs:
        - name: Cypress
          parallelism: 2
          commands:
            - mkdir -p reports/cypress
            - |
              SPECS=$(find tests/cypress/integration -name '*.spec.js' | sort \
                | awk -v i=$SEMAPHORE_JOB_INDEX -v n=$SEMAPHORE_JOB_COUNT 'NR % n == (i-1)' \
                | paste -sd, -)
              echo "Shard $SEMAPHORE_JOB_INDEX/$SEMAPHORE_JOB_COUNT specs:"
              echo "$SPECS" | tr , '\n'
              npx cypress run --quiet --spec "$SPECS" \
                --reporter cypress-multi-reporters \
                --reporter-options configFile=reporter-config.json
        - name: Vitest
          commands:
            - mkdir -p reports/vitest
            - npx vitest run --reporter=default --reporter=junit --outputFile.junit=reports/vitest/vitest-junit.xml
